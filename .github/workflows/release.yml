name: release

on:
  push:
    branches: [main]
    paths:
      - .claude-plugin/plugin.json
      - .claude-plugin/marketplace.json
      - .kimi-plugin/plugin.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      released: ${{ steps.tag.outputs.released }}
    steps:
      - uses: actions/checkout@v7

      # /plugin update reads marketplace.json, so a manifest left behind ships the old version silently
      - id: read
        name: Check the three manifests agree
        run: |
          claude=$(jq -r .version .claude-plugin/plugin.json)
          marketplace=$(jq -r .metadata.version .claude-plugin/marketplace.json)
          kimi=$(jq -r .version .kimi-plugin/plugin.json)
          echo "plugin.json $claude · marketplace.json $marketplace · kimi plugin.json $kimi"
          if [[ "$claude" != "$marketplace" || "$claude" != "$kimi" ]]; then
            echo "::error::Manifest versions differ; set all three to the same version"
            exit 1
          fi
          echo "version=$claude" >> "$GITHUB_OUTPUT"

      - id: tag
        name: Check whether this version is already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.read.outputs.version }}" > /dev/null 2>&1; then
            echo "v${{ steps.read.outputs.version }} already released; nothing to do"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.released == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes \
            --notes "$(cat <<'NOTES'
          Update an existing install:
          /plugin marketplace update voiceover-video-skill
          /plugin update

          Install in Claude Code:
          /plugin marketplace add Dancan254/voiceover-video-skill
          /plugin install voiceover-video@voiceover-video-skill

          Install in Kimi Code CLI:
          /plugins install https://github.com/Dancan254/voiceover-video-skill
          NOTES
          )"
